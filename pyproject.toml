[project]
name = "absranobedb"
version = "1.4.4"
description = "RanobeDB Metadata Provider for Audiobookshelf"
license = { text = "MIT" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiolimiter>=1.3.0",
    "aiosqlite>=0.22.1",
    "aiohttp-client-cache>=0.15.0",
    "requests>=2.34.2",
    "langcodes>=3.5.1",
    "language_data>=1.4.0",
    "browserforge>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "types-requests",
]

[project.urls]
homepage = "https://github.com/kennethsible/abs-ranobedb"

[project.scripts]
absranobedb = "absranobedb.main:main"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
files = ["src"]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
